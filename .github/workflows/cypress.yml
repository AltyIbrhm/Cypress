name: Cypress Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Cypress
        run: npx cypress install

      - name: Ensure reports directory exists
        run: mkdir -p cypress/reports

      - name: Run E2E Cypress tests with reporting and record to Cypress Cloud
        run: npx cypress run --reporter mochawesome --record --key ${{ secrets.CYPRESS_RECORD_KEY }}

      - name: Run Component tests
        run: npx cypress run --component --reporter mochawesome
        if: always()

      - name: Generate HTML report
        run: |
          if [ -f cypress/reports/*.json ]; then
            npm run report:merge
            npm run report:generate
          else
            echo "No test reports found to merge"
            echo '{"stats":{"passes":0,"failures":0,"duration":0},"results":[]}' > cypress/reports/output.json
          fi
        if: always()

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore

      - name: Upload videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos
          path: cypress/videos
          if-no-files-found: ignore

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-html-report
          path: cypress/reports/
          if-no-files-found: ignore 