name: Cypress Component Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  cypress-component:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Ensure reports directory exists
        run: mkdir -p cypress/reports

      - name: Run Component tests
        uses: cypress-io/github-action@v6
        with:
          command: npm run test:component:report

      - name: Generate Component HTML report
        run: |
          if [ -f cypress/reports/*.json ]; then
            npm run report:merge
            npm run report:generate
          else
            echo "No component test reports found to merge"
            echo '{"stats":{"passes":0,"failures":0,"duration":0},"results":[]}' > cypress/reports/component-output.json
          fi
        if: always()

      - name: Upload component screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-component-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore

      - name: Upload component videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-component-videos
          path: cypress/videos
          if-no-files-found: ignore

      - name: Upload component HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-component-html-report
          path: cypress/reports/
          if-no-files-found: ignore 